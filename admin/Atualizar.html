<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighters Guild DB - Atualizar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/CRUD.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <div class="logo-icon">🎮</div>
                <span class="brand">FIGHTERS<br>GUILD DB</span>
            </div>
            <ul class="nav-links">
                <li><a href="../TelaPrincipal.html">🏠</a></li>
                <li><a href="./CRUDMenu.html">CRUD</a></li>
            </ul>
        </nav>
    </header>

    <main class="crud-shell">
        <section class="card">
            <span class="badge">ATUALIZAR</span>
            <h1>Selecione o registro para editar</h1>
            <label class="field">
                <span class="field-label">Tipo</span>
                <select id="tipo-entidade">
                    <option value="jogo">Jogo</option>
                    <option value="personagem">Personagem</option>
                    <option value="personagem_jogo">Personagem em um jogo</option>
                    <option value="golpe">Golpe</option>
                    <option value="arquetipo">Arquétipo</option>
                </select>
            </label>
            <label class="field">
                <span class="field-label">Registro cadastrado</span>
                <select id="registro-select"></select>
            </label>
            <button id="btn-carregar" class="btn-submit">Carregar dados</button>
            <div id="form-container"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/Atualizar.js"></script>
</body>
</html>
