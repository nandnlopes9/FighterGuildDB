<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fighters Guild DB - Jogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style_jogo.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <div class="logo-icon">🎮</div>
                <span class="brand">FIGHTERS<br>GUILD DB</span>
            </div>
            <ul class="nav-links">
                <li><a href="./TelaPrincipal.html">🏠</a></li>
                <li><a href="./TelaJogos.html">Jogos</a></li>
                <li><a href="./TelaPersonagens.html">Personagens</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-title">
            <h1 id="title">Street Fighter 6</h1>
        </section>

        <section class="game-panel">
            <article class="game-info">
                <img id="capaJogo" alt="Capa do jogo">
                <div class="game-details">
                    <p id="franquia" class="texto">Franquia: </p>
                    <p id="dataLancamento" class="texto">Ano de lançamento: </p>
                    <p id="genero" class="texto">Gênero: </p>
                    <p id="desenvolvedora" class="texto">Desenvolvedora: </p>
                </div>
            </article>

            <article class="player-section">
                <div class="section-header">
                    <h2>Selecione o personagem para abrir a lista de comandos</h2>
                </div>
                <div id="container_personagem">
                    <div id="moldura"></div>
                    <section id="personagens">
                        
                    </section>
                </div>
            </article>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/script_jogo.js"></script>
</body>
</html>
