<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighters Guild DB - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/Admin.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <div class="logo-icon">🎮</div>
                <span class="brand">FIGHTERS<br>GUILD DB</span>
            </div>
            <ul class="nav-links">
                <li><a href="./TelaPrincipal.html">🏠</a></li>
                <li><a href="./tela_jogo.html">Jogos</a></li>
                <li><a href="./TelaPersonagens.html">PERSONAGENS</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="admin-header">
            <span class="admin-badge">ADMIN</span>
            <div class="admin-tabs">
                <button class="admin-tab is-active" data-target="form-jogo">NOVO JOGO</button>
                <button class="admin-tab" data-target="form-personagem">NOVO PERSONAGEM</button>
            </div>
        </div>

        <!-- NOVO JOGO -->
        <form id="form-jogo" class="admin-form is-active" autocomplete="off">
            <label class="field">
                <span class="field-label">Imagem</span>
                <input type="url" name="capa" placeholder="https://... (URL da capa)">
            </label>
            <label class="field">
                <span class="field-label">Nome</span>
                <input type="text" name="nome" required>
            </label>
            <label class="field">
                <span class="field-label">Franquia</span>
                <input type="text" name="franquia">
            </label>
            <label class="field">
                <span class="field-label">Desenvolvedora</span>
                <input type="text" name="desenvolvedora">
            </label>
            <label class="field">
                <span class="field-label">Genero</span>
                <input type="text" name="genero">
            </label>
            <label class="field">
                <span class="field-label">Ano (data de lançamento)</span>
                <input type="date" name="data_lancamento">
            </label>
            <button type="submit" class="btn-salvar">Salvar Jogo</button>
            <p class="form-msg" data-for="form-jogo"></p>
        </form>

        <!-- NOVO PERSONAGEM -->
        <form id="form-personagem" class="admin-form" autocomplete="off">
            <h3 class="form-section-title">Personagem</h3>
            <label class="field">
                <span class="field-label">Nome</span>
                <input type="text" name="nome" required>
            </label>
            <label class="field">
                <span class="field-label">Arquetipo</span>
                <select name="id_arquetipo" required>
                    <option value="" disabled selected>Carregando...</option>
                </select>
            </label>
            <label class="field">
                <span class="field-label">História</span>
                <textarea name="historia" rows="3"></textarea>
            </label>
            <label class="field">
                <span class="field-label">Ícone</span>
                <input type="url" name="icone" placeholder="https://... (URL do ícone)">
            </label>

            <h3 class="form-section-title">Participação em um jogo</h3>
            <label class="field">
                <span class="field-label">Jogo</span>
                <select name="id_jogo" required>
                    <option value="" disabled selected>Carregando...</option>
                </select>
            </label>
            <label class="field">
                <span class="field-label">Data de Lançamento</span>
                <input type="date" name="data_de_inclusao">
            </label>
            <label class="field">
                <span class="field-label">Vida</span>
                <input type="number" name="vida" min="0" placeholder="ex.: 1000">
            </label>
            <label class="field">
                <span class="field-label">Dificuldade</span>
                <select name="dificuldade">
                    <option value="1">Fácil (1)</option>
                    <option value="2" selected>Média (2)</option>
                    <option value="3">Difícil (3)</option>
                </select>
            </label>
            <button type="submit" class="btn-salvar">Salvar Personagem</button>
            <p class="form-msg" data-for="form-personagem"></p>
        </form>
    </main>

    <!-- Troca de abas: script comum, sem depender do Supabase -->
    <script>
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const alvo = tab.dataset.target;
                document.querySelectorAll('.admin-tab').forEach(t =>
                    t.classList.toggle('is-active', t === tab));
                document.querySelectorAll('.admin-form').forEach(f =>
                    f.classList.toggle('is-active', f.id === alvo));
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/Admin.js"></script>
</body>
</html>
