<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighters Guild DB - Cadastro de Golpe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CadastroGolpe.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <div class="logo-icon">🎮</div>
                <span class="brand">FIGHTERS<br>GUILD DB</span>
            </div>
            <ul class="nav-links">
                <li><a href="./TelaPrincipal.html">🏠</a></li>
                <li><a href="./tela_jogo.html">Jogos</a></li>
                <li><a href="./TelaPersonagens.html">PERSONAGENS</a></li>
                <li><a href="./CadastroGolpe.html">GOLPES</a></li>
            </ul>
        </nav>
    </header>

    <main class="cadastro-golpe-shell">
        <section class="cadastro-golpe-card">
            <div class="character-preview-panel">
                <div class="character-preview-frame">
                    <img id="personagem-preview-image" class="character-preview-image" alt="Preview do personagem">
                </div>
                <div id="personagem-preview-name" class="character-preview-name">Selecione um personagem</div>
            </div>

            <div class="cadastro-golpe-form-panel">
                <div class="field-row">
                    <label class="field">
                        <span class="field-label">Selecione o jogo</span>
                        <select id="select-jogo">
                            <option value="" disabled selected>Carregando...</option>
                        </select>
                    </label>

                    <label class="field">
                        <span class="field-label">Selecione o personagem</span>
                        <select id="select-personagem" disabled>
                            <option value="" disabled selected>Selecione um jogo primeiro</option>
                        </select>
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span class="field-label">Nome do comando</span>
                        <input id="nome-comando" type="text" placeholder="Nome do comando">
                    </label>

                    <label class="field">
                        <span class="field-label">Tipo</span>
                        <select id="tipo-comando">
                            <option value="Normal">Normal</option>
                            <option value="Especial">Especial</option>
                        </select>
                    </label>
                </div>

                <label class="field">
                    <span class="field-label">Campo do comando</span>
                    <textarea id="comando" rows="3" placeholder="Adicione o comando"></textarea>
                </label>

                <div id="command-groups" class="command-groups" aria-label="Seleção de comandos"></div>

                <button id="btn-confirmar" class="btn-confirmar" type="button">Confirmar</button>
                <p id="feedback" class="form-feedback" aria-live="polite"></p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./CadastroGolpe.js"></script>
</body>
</html>
