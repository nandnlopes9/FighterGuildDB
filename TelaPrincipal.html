<!DOCTYPE html>
<html lang="pt-BR">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/TelaPrincipal..css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/TelaInicial.js"></script>
    
</head>
<body>
    <header>
        <nav>
            <a href="./TelaPrincipal.html" class="logo" aria-label="Ir para a página inicial">
                <div class="logo-icon">🎮</div>
                <span class="brand">FIGHTERS<br>GUILD DB</span>
            </a>
            <ul class="nav-links">
                <li><a href="./TelaPrincipal.html">Home</a></li>
                <li><a href="./TelaJogos.html">Jogos</a></li>
                <!-- <li><a href="#tier">Tier Lists</a></li> -->
                <!-- <li><a href="#community">Community</a></li> -->
                <li><a href="./TelaPersonagens.html">PERSONAGENS</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero-title">
            <h1>LISTA DE COMANDOS DATABASE</h1>
        </div>

        <div class="character-banner" >
            <div class="graphic-banner" >
                <img src="Marquee.png" alt="" style="height: 100%; width: 100%;">
            </div>
        </div>

        <p class="banner-tagline">Todos os comandos. Todos os jogos.</p>



        <!--Destaques-->
        <div class="destaque">
            <div class="featured-section">
                <h2 class="section-title">Destaque</h2>
                <div id="featured-card" class="featured-card">
                    <div class="featured-card-graphic">
                        <span class="featured-card-title">CARREGANDO</span>
                        <span class="featured-card-subtitle">NOVO CAMPEÃO</span>
                        <span class="featured-card-accent">...</span>
                    </div>
                    <div class="featured-info">
                        <p class="featured-label">Aguarde...</p>
                        <p class="featured-difficulty">Carregando dados...</p>
                        <span class="moveset-badge">🎮 MOVESET</span>
                    </div>
                </div>
            </div>

            
            
            <!-- ATUALIZAÇÓES RESCENTES-->
            <div class="featured-section">
                <h2 class="section-title">Atualizações Recentes</h2>
                <div id="updates-list" class="updates-list"></div>
            </div>
        </div>


        <!--Trending Games-->
        <div class="trending-section">
            <h2 class="section-title">TRENDING GAMES</h2>
            <div id="games-grid" class="game-grid"></div>
        </div>
